services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: riftwatch
      POSTGRES_USER: riftwatch
      POSTGRES_PASSWORD: riftwatch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riftwatch -d riftwatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - riftwatch-postgres:/var/lib/postgresql/data

volumes:
  riftwatch-postgres:
