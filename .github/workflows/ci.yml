name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: riftwatch
          POSTGRES_USER: riftwatch
          POSTGRES_PASSWORD: riftwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U riftwatch -d riftwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://riftwatch:riftwatch@localhost:5432/riftwatch
      DATABASE_URL_DIRECT: postgresql://riftwatch:riftwatch@localhost:5432/riftwatch
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-only-secret-at-least-32-characters
      AUTH_ENABLE_DEV_PROVIDER: "false"
      ADMIN_EMAIL: admin@riftwatch.com
      CRON_SECRET: ci-only-cron-secret-at-least-32-characters
      CARD_TRADER_AUTH_TOKEN: ci-placeholder-not-used
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Seed CI database
        run: pnpm db:seed
      - name: Check formatting
        run: pnpm format:check
      - name: Check documentation
        run: pnpm docs:check
      - name: Lint
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test
      - name: Build application
        run: pnpm build
      - name: Type-check
        run: pnpm typecheck
      - name: Run integration tests
        run: pnpm test:integration
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:e2e

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
