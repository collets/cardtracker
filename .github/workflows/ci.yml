name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: riftwatch
          POSTGRES_USER: riftwatch
          POSTGRES_PASSWORD: riftwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U riftwatch -d riftwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://riftwatch:riftwatch@localhost:5432/riftwatch
      DATABASE_URL_DIRECT: postgresql://riftwatch:riftwatch@localhost:5432/riftwatch
      AUTH_SECRET: ci-only-secret-at-least-32-characters
      AUTH_ENABLE_DEV_PROVIDER: "false"
      ADMIN_EMAIL: admin@riftwatch.com
      CRON_SECRET: ci-only-cron-secret
      CARD_TRADER_AUTH_TOKEN: ci-placeholder-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
